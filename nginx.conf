server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames change whenever content changes, so they can be cached
    # forever. index.html must NOT be, or a returning visitor keeps loading the old
    # bundle and never sees a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy API calls to the gateway so the browser stays on one origin and CORS
    # never comes up.
    location /api/ {
        proxy_pass http://gateway:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events. Without these three the order tracking stream is
        # buffered and the client receives nothing until the saga finishes — which
        # defeats the entire point of the endpoint.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: React Router owns the URL space, so any unmatched path must
    # return index.html rather than a 404. Without this, reloading /orders/abc-123
    # gives nginx's 404 page instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening. A real deployment adds a Content-Security-Policy too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
